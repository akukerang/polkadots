general.import = [
  "~/.config/alacritty/catppuccin-macchiato.toml"
]

[mouse]
hide_when_typing = true

[window]
opacity = 0.9
padding = { x = 15, y = 15 }

[env]
TERM = "xterm-256color"

[font]
size = 10.5

[font.bold]
family = "CaskaydiaCove Nerd Font"
style = "Bold"

[font.bold_italic]
family = "CaskaydiaCove Nerd Font"
# family = "MesloLGS Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "CaskaydiaCove Nerd Font"
# family = "MesloLGS Nerd Font Mono"
style = "Italic"

[font.normal]
# family = "MesloLGS Nerd Font Mono"
family = "CaskaydiaCove Nerd Font"
style = "Regular"
